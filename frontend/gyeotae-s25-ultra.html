<html lang="ko">

<title>곁에</title>
<style>
html,body{margin:0;min-height:100%;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#e4e4e4}
body{display:grid;justify-items:center;align-content:start;min-height:100dvh}
main{position:relative;overflow:hidden}
main>div{transform-origin:top left;transform:scale(var(--scale,1))}
button,.touch{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid #2563eb;outline-offset:-4px}
button[aria-pressed=true]{outline:3px solid #2563eb;outline-offset:-4px}

.topbar{position:relative;width:100%;box-sizing:border-box;display:flex;justify-content:space-between;padding:4px 8px;gap:8px;background:#e4e4e4}
.topbar button,.form button{min-height:44px;border:2px solid #222;border-radius:14px;background:#fff;color:#222;font-family:inherit;font-size:16px;font-weight:700;padding:5px 14px}
.topbar button:disabled{opacity:.5;cursor:default}
.form{padding:24px 21px;display:flex;flex-direction:column;gap:14px;background:#fff;box-sizing:border-box;overflow:auto!important}
.form [hidden]{display:none}.route-entry{position:absolute;z-index:4;right:12px;top:62px;min-height:44px;border:2px solid #222;border-radius:14px;background:white;font:700 16px sans-serif;padding:6px 12px}
#speech-issue:not(:empty){position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;background:#222;color:#fff;padding:9px 14px;border-radius:12px;width:max-content;max-width:85vw}
.form h1{font-size:23px;margin:0}.form p{margin:0;line-height:1.45}
.form input:not([type=file]){box-sizing:border-box;width:100%;padding:10px;border:2px solid #222;border-radius:10px;font:inherit}
.form audio{width:100%}.form .strong{background:#222;color:white}.form .spacer{flex:1}
[data-route-status]{min-height:40px;white-space:pre-line}

.phone{max-width:100vw;box-sizing:border-box;border:2px solid #222;border-radius:24px;overflow:hidden;background:#e4e4e4}
.phone main>div:first-child{border:0!important;border-radius:0!important}
.phone .topbar{border-bottom:1px solid #bbb}
.phone .topbar{background:#e4e4e4;padding-inline:10px}
.question,.question:active,.question:focus{color:#111!important;background:#fff!important}
.answers button:not(:last-child){height:auto!important;min-height:54px;padding:8px;font-family:inherit;font-size:26px!important;font-weight:700}
dialog:not([open]){display:none} dialog{width:min(350px,calc(100vw - 32px));max-height:85dvh;border:2px solid #222;border-radius:18px;color:#111}
dialog::backdrop{background:#0008}
dialog label{display:grid;gap:5px;font-weight:700}
</style></head>

lay:flex;flex-direction:column;gap:6px;font-weight:700;font-size:16px">2. 어르신이 하는 말<input placeholder="예: 그려" style="height:52px;box-sizing:border-box;border:2px solid #222;border-radius:10px;padding:0 12px;font-size:16px"></label><button style="height:52px;flex-shrink:0;box-sizing:border-box;border:2px dashed #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#fff;color:#222">어르신이 말해보기 (시간 되면)</button><div style="font-size:15px;font-weight:400;color:#333;line-height:1.35;text-align:left;white-space:pre-line">어르신께 알리고 동의를 받은 뒤 하세요. 곁에는 녹음 파일 없이 글자만 이 폰에 저장해요. 말소리는 음성 인식을 위해 외부 서버로 보내질 수 있어요.</div><button style="height:52px;flex-shrink:0;box-sizing:border-box;border:2px solid #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#fff;color:#222">+ 말 추가</button><div style="font-size:16px;font-weight:700;color:#111;line-height:1.35;text-align:left;white-space:pre-line">등록한 말</div><div style="height:52px;flex-shrink:0;box-sizing:border-box;border:2px dashed #666;border-radius:14px;background:#eee;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;padding:10px;font-size:16px;line-height:1.4;color:#222;">"그려" → 응  ·  삭제</div><div style="flex:1"></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;flex-shrink:0"><button style="height:56px;flex-shrink:0;box-sizing:border-box;border:2px solid #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#fff;color:#222">건너뛰기</button><button style="height:56px;flex-shrink:0;box-sizing:border-box;border:2px solid #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#222;color:#fff">다음</button></div></div></template>
<template id="F8"><div style="position:absolute;left:0;top:0;width:390px;height:844px;box-sizing:border-box;border:3px solid #222;border-radius:30px;background:#fff;padding:24px 21px;display:flex;flex-direction:column;gap:14px;overflow:hidden"><div style="font-size:14px;font-weight:400;color:#444;line-height:1.35;text-align:left;white-space:pre-line">⑤ 마지막 확인</div><div style="font-size:22px;font-weight:700;color:#111;line-height:1.35;text-align:left;white-space:pre-line">미리 듣기</div><div style="height:360px;flex-shrink:0;box-sizing:border-box;border:2px dashed #666;border-radius:14px;background:#eee;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;padding:10px;font-size:18px;line-height:1.4;color:#222;">말하는 아바타
(AI 도우미 표시)</div><button style="height:56px;flex-shrink:0;box-sizing:border-box;border:2px solid #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#fff;color:#222">▶ 재생하기</button><div style="flex:1"></div><div style="font-size:15px;font-weight:400;color:#333;line-height:1.35;text-align:left;white-space:pre-line">설정은 이 폰에만 저장돼요. 이 폰을 어르신께 드리거나 곁에를 설치해 주세요.</div><button style="height:56px;flex-shrink:0;box-sizing:border-box;border:2px solid #222;border-radius:14px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;white-space:pre-line;background:#222;color:#fff">설정 완료</button></div></template>
<script>
const app=document.querySelector('main'), templates=new Map([...document.querySelectorAll('template')].map(t=>[t.id,t]));
const clean=s=>s.trim().replace(/\s+/g,' ');
const load=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
const save=(key,value)=>{try{localStorage.setItem(key,JSON.stringify(value))}catch{}};
let id, timer, recognition, origin='W1', destination='병원', alternate=false, taxiFirst=false, step=0, pickup='', photo='', aliasMeaning='응';
let places=load('gyeotae-places',[]), aliases=load('gyeotae-aliases',[['그려','응']]);
let voiceEnabled=load('gyeotae-voice-enabled',true);
let voiceRetry;
let localSpeech=false;
let micTrack, micRequest;
let micDenied=false;
function microphone(){
 if(micDenied)return Promise.reject(new DOMException('마이크 권한이 필요해요.','NotAllowedError'));
 if(micTrack?.readyState==='live')return Promise.resolve(micTrack);
 if(!micRequest)micRequest=navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
  micTrack=stream.getAudioTracks()[0];
  micTrack.enabled=false;
  return micTrack;
 }).catch(error=>{
  if(error.name==='NotAllowedError'||error.name==='SecurityError')micDenied=true;
  throw error;
 }).finally(()=>{micRequest=null});
 return micRequest;
}
addEventListener('pagehide',()=>{stopListening();micTrack?.stop();micTrack=null});
addEventListener('pageshow',event=>{if(event.persisted)startVoice()});
const speechOptions={langs:['ko-KR'],processLocally:true};
const speechAPI=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
const localAvailability=async()=>{
 try{return await speechAPI()?.available?.(speechOptions)}catch{return 'unavailable'}
};
let speechRevision=0;
let resumeRequest, mapURL;
const preferences=document.querySelector('#preferences');
function stopListening(){
 clearTimeout(voiceRetry);
 if(micTrack)micTrack.enabled=false;
 if(!recognition)return;
 const active=recognition;recognition=null;active.abort();
 setMicStatus(false);
}
function say(text,after){
 const engine=window.speechSynthesis;
 if(!engine){after?.();return}
 const voices=engine.getVoices().filter(v=>/^ko(?:[-_]|$)/i.test(v.lang));
 const voice=voices.find(v=>/선희|sunhi|yuna|유나/i.test(v.name))||voices.find(v=>v.default)||voices[0];
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang='ko-KR';utterance.rate=0.88;utterance.pitch=1.03;
 if(voice)utterance.voice=voice;
 utterance.onend=()=>after?.();
 utterance.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))after?.()};
 engine.cancel();engine.speak(utterance);
}
const alerts={E1:'어디에 가고 싶으세요?',E2:'○○병원이에요?',E3:'택시를 탈까요? 걸어서 갈까요?',E4:'지금 계신 곳에서 부를까요?', 'E4-1':'그럼 어디로 부를까요?',E6:'택시를 부를게요.',E7:'다른 길로 갈까요? 계속 부를까요?',E8:'택시가 3분 뒤에 도착한대요.', 'E8-1':'택시가 도착했어요. 확인해 주세요.',E9:'택시 번호를 확인해 주세요.',E5:'큰길로 나가세요.',W1:'약국에서 왼쪽으로 가세요.',W2:'멈춰서 비춰 주세요. 이쪽으로 가세요.',E10:'잘 오셨어요!'};
const routes={
 E2:{응:()=>go(taxiFirst?'E4':'E3'),아니:()=>{alternate=!alternate;go('E2',true)}},
 E3:{택시:'E4',걸어서:'W1'},E4:{응:'E6',아니:'E4-1'},
 E6:{'택시를 불렀어요':'E8','택시가 안 잡혀요':'E7'},
 'E8-1':{응:'E9',아니:'E8'},E9:{알겠어:'E10'},
 E5:{알겠어:'E6',잠깐:()=>say('잠깐 멈춰 있을게요.')},
 W1:{알겠어:()=>{if(++step>=2)go('E10');else go('W1',true)}},
 E7:{'다른 길':'E5','계속 부르기':'E6',계속:'E6'},E10:{처음으로:'E1'},
 F1:{시작하기:'F2'},F3:{'다시 만들기':'F2','이걸로 할게요':'F5'},
 F5:{'나중에 불러오기':'F6',다음:'F6'},F6:{다음:'F7'},F7:{건너뛰기:'F8',다음:'F8'},F8:{'설정 완료':'E1'}
};
function go(next,replace=false,quiet=false){
 const target='#'+next;
 if(location.hash!==target){const depth=history.state?.gyeotaeDepth||0;history[replace?'replaceState':'pushState']({gyeotaeDepth:depth+(replace?0:1)},'',target);}
 render(next);
 if(!quiet){if(alerts[next])speakQuestion();else startVoice()}
}
function speakQuestion(){
 const revision=++speechRevision;
 say(speechLine(),()=>{
  if(revision===speechRevision&&voiceEnabled&&!preferences.open&&micLabel())startVoice();
 });
}
function fit(){const scale=Math.min((innerWidth-4)/390,Math.max(1,innerHeight-4-document.querySelector('.topbar').offsetHeight)/844,412/390);app.style.width=390*scale+'px';app.style.height=844*scale+'px';app.parentElement.style.width=(390*scale+4)+'px';app.style.setProperty('--scale',scale)}
function leaf(text){return [...app.querySelectorAll('div,span')].find(n=>!n.children.length&&clean(n.textContent)===text)}
function activate(node,action){if(!node)return;node.classList.add('touch');node.tabIndex=0;node.setAttribute('role','button');node.onclick=action;node.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();action(e)}}}
function base(){return id.endsWith('s')?id.slice(0,-1):id}
function speechLine(){
 if(base()==='E2')return (alternate?'근처 다른 ':'')+destination+'에 가실 건가요?';
 if(base()==='E4'&&pickup)return pickup+'에서 부를까요?';
 if(base()==='W1'&&step)return '앞에 있는 횡단보도를 건너세요.';
 return alerts[base()]||'다시 말씀해 주세요.';
}
function pickupInput(){const place=prompt('타는 곳을 입력해 주세요.');if(place?.trim()){pickup=place.trim();go('E4')}}
function pick(place){destination=place;alternate=false;step=0;go('E2')}
function micLabel(){return app.querySelector('[data-mic-status]')}
function setMicStatus(active){
 const hint=micLabel();
 if(hint)hint.textContent=active?'● 듣고 있어요':'마이크 대기 중';
}
async function startVoice(){
 if(!voiceEnabled||!micLabel()||recognition||preferences.open||document.hidden)return;
 const revision=++speechRevision;
 localSpeech=(await localAvailability())==='available';
 if(revision!==speechRevision||preferences.open||document.hidden)return;
 listen(text=>{
  heard(text);
  if(revision===speechRevision)voiceRetry=setTimeout(startVoice,300);
 },error=>{
  if(error==='no-speech'||!error){voiceRetry=setTimeout(startVoice,500);return}
  if(id==='E1')go('E1-1',true,true);
  else if(templates.has(base()+'s')&&id===base())go(base()+'s',true,true);
 });
}
async function listen(callback,fallback){
 const SR=speechAPI();
 if(!SR){showSpeechIssue('이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.');fallback('unsupported');return}
 if(recognition)return;
 const rec=new SR();recognition=rec;rec.lang='ko-KR';rec.interimResults=false;rec.continuous=false;
 if('processLocally' in rec)rec.processLocally=localSpeech;
 function finish(text,error){
  if(recognition!==rec)return;
  recognition=null;if(micTrack)micTrack.enabled=false;setMicStatus(false);
  if(text)callback(text);else fallback(error);
 }
 rec.onstart=()=>{if(recognition===rec)setMicStatus(true)};
 rec.onresult=event=>finish(event.results[event.resultIndex||0][0].transcript);
 rec.onerror=event=>{
  if(recognition!==rec)return;
  const messages={
   'not-allowed':'브라우저에서 마이크를 허용한 뒤 새로고침해 주세요.',
   'service-not-allowed':'이 브라우저의 음성 인식이 제한되어 있어요. Chrome에서 열어 주세요.',
   'audio-capture':'마이크를 찾을 수 없어요.',
   network:'음성 인식 서버에 연결할 수 없어요. Chrome에서 열거나 설정에서 한국어 오프라인 인식을 설치해 주세요.'
  };
  if(event.error!=='no-speech')showSpeechIssue(messages[event.error]||'한국어 음성 인식을 시작할 수 없어요.');
  finish(null,event.error);
 };
 rec.onend=()=>finish();
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error('지원되지 않는 마이크 환경');
  const track=await microphone();
  if(recognition!==rec)return;
  window.speechSynthesis?.cancel();track.enabled=true;rec.start(track);
 }catch(error){
  if(recognition!==rec)return;
  showSpeechIssue(error.name==='NotAllowedError'?'브라우저 사이트 설정에서 마이크를 허용하고 새로고침해 주세요.':'마이크를 시작할 수 없어요. Chrome의 로컬 실행 화면에서 마이크를 확인해 주세요.');
  finish(null,'start');
 }
}
function heard(text){
 const b=base();
 if(/^(이전|뒤로)( 가| 가 줘)?[.!]?$/u.test(text.trim())){document.querySelector('#previous').click();return}
 if(text.includes('다른거')||text.includes('다른 거')){action('다른거');return}
 if(b==='D1'){app.querySelector('#route-goal').value=text;return}
 if(b==='E1'||b==='E1-1'){
   taxiFirst=text.includes('택시');const p=places.find(([name,,alias])=>text.includes(name)||(alias&&text.includes(alias)));
   const named=text.replace(/[.!?。]+$/u,'').replace(/(으로|로|에)?\s*(택시를?\s*(불러|잡아)|가고 싶어|가\s*줘|가\s*주세요|갈래|갈게|가자).*$/u,'').trim();
   if(named||p)pick(p?.[0]||named);else go('E1-1');return;
 }
 if(b==='E4-1'&&!text.includes('다시')){pickup=text;go('E4');return}
 if(b==='W2'&&text.includes('알겠어')){go(origin,true);return}
 if(text.includes('여기서 어디로')){say(speechLine());return}
 const alias=aliases.find(([phrase])=>text.includes(phrase));
 const phrases={응:/^(응|네|예|맞아|맞아요|좋아요)([\s,.!?]|$)/u,아니:/아니|싫어요|안 갈/u,알겠어:/알겠|확인했/u,걸어서:/걸어|도보/u};
 const available=[...Object.keys(routes[b]||{}),'다시'];
 const key=available.includes(alias?.[1])?alias[1]:available.find(word=>phrases[word]?.test(text.trim())||(!phrases[word]&&text.includes(word)));
 if(key)action(key);else if(templates.has(b+'s'))go(b+'s');
}
function action(label){
 const b=base();
 if(label.includes('말이 안 통하나요')){go(b+'s');return}
 if(label==='다른거'){
  if(b==='E2'){go('E1-1');return}
  if(b==='E4-1'){pickupInput();return}
  const response=prompt('다른 답을 입력해 주세요.');
  if(response?.trim())heard(response.trim());
  return;
 }
 if(label==='▼ 닫기'){go(b,true);return}
 if(label==='자동차 길 안내'){go('D1');return}
 if(label==='✕ 닫기'){go(origin,true);return}
 if(label==='지도 보기'||label.startsWith('카메라로 보기')){origin=b;go(label==='지도 보기'?'W3':'W2');return}
 if(label==='다시'||label==='다시 알려줘'){
  if(b==='E1-1')go('E1');else if(b==='E4-1')pickupInput();else speakQuestion();return;
 }
 if(b==='S2'){
  voiceEnabled=label==='허용';save('gyeotae-voice-enabled',voiceEnabled);save('gyeotae-seen',true);go('E1');
  return;
 }
 if(b==='E1-1'){
  const place=label==='목적지 입력'?prompt('목적지를 입력해 주세요.'):label;
  if(place?.trim()){taxiFirst=false;pick(place.trim())}
  return;
 }
 const dest=routes[b]?.[label];
 if(typeof dest==='function'){dest();return}
 if(dest){
  if(b==='F8')save('gyeotae-seen',true);
  go(dest);return;
 }
 family(label);
}
function play(){if(callFile)new Audio(callUrl).play().catch(()=>alert('이 브라우저에서 재생할 수 없는 녹음 형식이에요.'));else say(alerts.E4)}
function family(label){
 const inputs=[...app.querySelectorAll('input:not([type=file])')];
 if(id==='F2'&&label==='아바타 만들기'){
  if(!inputs[0].checked||!photo){alert('동의에 체크하고 사진을 선택해 주세요.');return}go('F3');return;
 }
 if(label==='내 녹음 듣기'||label==='▶ 재생하기'){play();return}
 if(label==='+ 장소 추가'){
  const values=inputs.map(n=>n.value.trim());if(!values[0]||!values[1]){alert('이름과 주소를 입력해 주세요.');return}
  places.push(values);save('gyeotae-places',places);render(id);return;
 }
 if(id==='F7'){
  if(['응','아니','알겠어','다시','잠깐'].includes(label)){aliasMeaning=label;app.querySelectorAll('button[aria-pressed]').forEach(n=>n.setAttribute('aria-pressed',String(clean(n.textContent)===label)));return}
  if(label.startsWith('어르신이 말해보기')){listen(t=>inputs[0].value=t,()=>inputs[0].focus());return}
  if(label==='+ 말 추가'){
   const phrase=inputs[0].value.trim();if(!phrase){inputs[0].focus();return}
   aliases=aliases.filter(([p])=>p!==phrase);aliases.push([phrase,aliasMeaning]);save('gyeotae-aliases',aliases);render(id);
  }
 }
}
function image(layer){
 if(!photo||!layer)return;
 layer.style.backgroundImage='url("'+photo+'")';layer.style.backgroundSize='contain';layer.style.backgroundRepeat='no-repeat';layer.style.backgroundPosition='center';layer.style.color='transparent';
}
function render(next){
 if(next==='F4')next='F3';
 if(!templates.has(next))next='S0';
 clearTimeout(timer);++speechRevision;stopListening();
 if(next!==id){routeController?.abort();if(mapURL){URL.revokeObjectURL(mapURL);mapURL=null}window.speechSynthesis?.cancel()}
 id=next;document.querySelector('#previous').disabled=!(history.state?.gyeotaeDepth)&&id==='S0';app.replaceChildren(templates.get(id).content.cloneNode(true));
 const b=base();
 const buttons=[...app.querySelectorAll('button')];

 if(b==='E4'&&pickup){const line=[...app.querySelectorAll('div')].find(n=>!n.children.length&&n.textContent.includes('부를까요?'));line?.replaceChildren('"'+speechLine()+'"')}
 if(b==='E2')leaf('"○○동 ○○병원이에요?"')?.replaceChildren('"'+speechLine()+'"');
 if(b==='W1'&&step)leaf('"약국에서 왼쪽으로 가세요."')?.replaceChildren('"'+speechLine()+'"');
 for(const node of app.querySelectorAll('div,span')){

 if(id==='F2'){

  file.onchange=()=>{if(file.files[0]){if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(file.files[0]);chooser.textContent='사진 선택 완료'}};

 if(id==='F3'){const layer=leaf('아바타 미리보기');image(layer)}

/* 개인 로컬 테스트용. 키를 채운 HTML은 배포하거나 공유하지 마세요. */
const NAVER_MAPS = {
 key: '',
 directions: 'https://maps.apigw.ntruss.com/map-direction/v1/driving',
 geocode: 'https://maps.apigw.ntruss.com/map-geocode/v2/geocode',
 useLocalProxy: true
};
let routeController, callFile, callUrl, callError='', callRevision=0;
function callStorage(mode,write){
 return new Promise((resolve,reject)=>{
  const open=indexedDB.open('gyeotae-call-audio',1);
  open.onupgradeneeded=()=>open.result.createObjectStore('files');
  open.onerror=()=>reject(open.error);
  open.onsuccess=()=>{
   const db=open.result, transaction=db.transaction('files',mode), files=transaction.objectStore('files');
   const request=mode==='readonly'?files.get('family'):write?files.put(write,'family'):files.delete('family');
   transaction.oncomplete=()=>{db.close();resolve(request.result)};
   transaction.onerror=transaction.onabort=()=>{db.close();reject(transaction.error)};
  };
 });
}
function setCall(file){
 if(callUrl)URL.revokeObjectURL(callUrl);
 callFile=file;callUrl=file?URL.createObjectURL(file):'';
}
function paintCall(){
 const player=app.querySelector('#call-audio');
 if(!player)return;
 if(callFile){if(player.getAttribute('src')!==callUrl)player.src=callUrl}
 else{player.removeAttribute('src');player.load()}
 player.hidden=!callFile;
 app.querySelector('#call-remove').hidden=!callFile;
 app.querySelector('#call-status').textContent=callError||(callFile?callFile.name:'선택한 파일이 없어요.');
}
function setupCallImport(){
 const file=app.querySelector('#call-file');
 app.querySelector('#call-select').onclick=()=>file.click();
 app.querySelector('#call-audio').onerror=()=>{if(callFile)app.querySelector('#call-status').textContent='이 녹음 형식은 재생할 수 없어요. M4A나 MP3 파일을 선택해 주세요.'};
 async function update(value){
  const revision=++callRevision;
  callError='';setCall(value);paintCall();
  try{await callStorage('readwrite',value)}catch{if(revision===callRevision){callError=value?'이 브라우저에서는 파일을 현재 실행 중에만 재생할 수 있어요.':'저장된 파일을 삭제하지 못했어요.';paintCall()}}
 }
 file.onchange=()=>{if(file.files[0])update(file.files[0]);file.value=''};
 app.querySelector('#call-remove').onclick=()=>update(null);
 paintCall();
}
Promise.resolve().then(()=>callStorage('readonly')).then(file=>{if(!callRevision&&file){setCall(file);paintCall()}}).catch(()=>{});
function showSpeechIssue(message){
 const issue=document.querySelector('#speech-issue');issue.textContent=message;
 clearTimeout(issue.timeout);
 issue.timeout=setTimeout(()=>issue.textContent='',5500);
}
function mountDirectionsButton(){
 const screen=app.firstElementChild;
 const button=document.createElement('button');
 button.type='button';button.className='route-entry';button.textContent=id==='E1'?'지도 보기':'자동차 길 안내';
 button.onclick=()=>action(button.textContent);screen.append(button);
}
function position(){
 return new Promise((resolve,reject)=>{
  if(!navigator.geolocation)return reject(new Error('출발지 주소나 좌표를 입력해 주세요.'));
  navigator.geolocation.getCurrentPosition(({coords})=>resolve(coords.longitude+','+coords.latitude),
   ()=>reject(new Error('현재 위치를 가져오지 못했어요. 위치 권한을 확인하거나 출발지를 입력해 주세요.')),
   {timeout:8000,maximumAge:15000});
 });
}
async function mapRequest(service,params,signal){
 const query=new URLSearchParams(params);
 const local=NAVER_MAPS.useLocalProxy&&['localhost','127.0.0.1'].includes(location.hostname);
 if(!local)throw new Error('기존 Python 서버에서 이 화면을 열어 주세요.');
 if(!NAVER_MAPS.key)throw new Error('네이버 지도 API 키를 입력해 주세요.');
 const url=(local?'/api/'+service:NAVER_MAPS[service])+'?'+query;
 const headers={Accept:service==='static-map'?'image/png':'application/json'};
 headers['x-ncp-apigw-api-key']=NAVER_MAPS.key;
 let response;
 try{response=await fetch(url,{headers,signal})}catch(error){
  if(signal.aborted)throw error;
  throw new Error(local?'로컬 서버나 네이버 지도 연결을 확인해 주세요.':'브라우저에서 요청에 실패했어요. 네트워크 또는 CORS 제한을 확인하고 로컬 서버로 실행해 주세요.');
 }
 if(service==='static-map'&&response.ok){
  const image=await response.blob();
  if(image.type!=='image/png')throw new Error('네이버 지도 이미지를 읽을 수 없어요.');
  return image;
 }
 const data=await response.json().catch(()=>null);
 if(response.status===401||response.status===403)throw new Error('Maps 인증에 실패했어요. Key ID, Key, API 사용 설정을 확인해 주세요.');
 if(response.status===429)throw new Error('Maps 요청 한도에 도달했어요.');
 if(!response.ok&&(!data||service!=='directions'||typeof data.code!=='number'))throw new Error(data?.error||('Maps 요청 오류 (HTTP '+response.status+').'));
 if(!data)throw new Error('Maps 응답을 읽을 수 없어요.');
 return data;
}
function coord(value){
 const match=value.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
 if(!match)return null;
 const [,x,y]=match;if(Math.abs(+x)>180||Math.abs(+y)>90)throw new Error('좌표를 경도,위도 순서로 입력해 주세요.');
 return x+','+y;
}
async function pointFor(value,signal){
 const pair=coord(value);
 if(pair)return pair;
 const data=await mapRequest('geocode',{query:value,count:'2'},signal);
 if(!data.addresses?.length)throw new Error('주소를 찾지 못했어요. 도로명과 건물 번호 또는 좌표를 입력해 주세요.');
 if(data.addresses.length>1)throw new Error('일치하는 주소가 여러 개예요. 시·구·도로명·건물 번호까지 입력해 주세요.');
 const point=coord(data.addresses[0].x+','+data.addresses[0].y);
 if(!point)throw new Error('주소에서 좌표를 읽을 수 없어요.');
 return point;
}
async function driving(start,goal,signal){
 const data=await mapRequest('directions',{start,goal,option:'traoptimal',lang:'ko'},signal);
 const route=data.route?.traoptimal?.[0];
 const errors={1:'출발지와 목적지가 같아요.',2:'출발지나 목적지 근처에 자동차 도로가 없어요.',3:'자동차 경로를 찾지 못했어요.'};
 if(data.code!==0||!route)throw new Error(errors[data.code]||'자동차 경로를 찾지 못했어요.');
 const summary=route.summary||{};
 const overview=Number.isFinite(summary.duration)&&Number.isFinite(summary.distance)
  ? '자동차로 약 '+Math.ceil(summary.duration/60000)+'분, '+(summary.distance/1000).toFixed(1)+'킬로미터예요.' : '자동차 경로를 찾았어요.';
 return [overview,...(route.guide||[]).map(item=>item.instructions?.trim()).filter(Boolean)];
}
function setupMap(){
 const form=app.querySelector('#map-search'), field=app.querySelector('#map-address');
 const status=app.querySelector('#map-status'), image=app.querySelector('#naver-map');
 const zoom=app.querySelector('#map-zoom'), zoomIn=app.querySelector('#map-in'), zoomOut=app.querySelector('#map-out');
 field.value=places.find(([name])=>name===destination)?.[1]||'';
 let center, level=15;
 async function loadMap(point){
  if(!['localhost','127.0.0.1'].includes(location.hostname)){
   const link=document.createElement('a');link.href='http://localhost:8765/#W3';link.textContent='네이버 지도 열기';status.replaceChildren('Python 서버를 실행한 뒤 ',link);return;
  }
  if(!NAVER_MAPS.key){resumeRequest=()=>loadMap(point);openPreferences();return}
  routeController?.abort();
  const controller=new AbortController();routeController=controller;
  const {signal}=controller;
  status.textContent='네이버 지도를 불러오는 중이에요.';
  const deadline=setTimeout(()=>controller.abort('timeout'),20000);
  try{
   const value=field.value.trim();
   const location=point||(value?await pointFor(value,signal):await position());
   if(signal.aborted)return;
   const blob=await mapRequest('static-map',{w:'348',h:'416',scale:'2',center:location,level:String(level),markers:'type:d|size:mid|pos:'+location.replace(',',' '),format:'png'},signal);
   if(signal.aborted)return;
   if(mapURL)URL.revokeObjectURL(mapURL);
   mapURL=URL.createObjectURL(blob);image.src=mapURL;image.hidden=false;
   zoom.hidden=false;zoomIn.disabled=level>=20;zoomOut.disabled=level<=6;
   center=location;status.textContent='';
  }catch(error){
   if(!signal.aborted||signal.reason==='timeout')status.textContent=signal.reason==='timeout'?'지도를 불러오는 데 시간이 오래 걸려요. 다시 눌러 주세요.':error.message;
  }finally{clearTimeout(deadline)}
 }
 form.querySelector('button').type='submit';
 form.onsubmit=event=>{event.preventDefault();level=15;loadMap()};
 zoomIn.onclick=()=>{if(center&&level<20){level++;loadMap(center)}};
 zoomOut.onclick=()=>{if(center&&level>6){level--;loadMap(center)}};
 loadMap();
}
function setupDirections(){
 const start=app.querySelector('#route-start'), goal=app.querySelector('#route-goal');
 const status=app.querySelector('[data-route-status]'), find=app.querySelector('#route-find');
 const repeat=app.querySelector('#route-repeat'), next=app.querySelector('#route-next');
 start.value=pickup;
 goal.value=places.find(([name])=>name===destination)?.[1]||(!['병원','시장','터미널'].includes(destination)?destination:'');
 let lines=[], index=0;
 function read(){
  status.textContent=lines[index];repeat.hidden=false;next.hidden=index>=lines.length-1;
  say(lines[index]);
 }
 repeat.onclick=read;next.onclick=()=>{if(index<lines.length-1){index++;read()}};
 find.onclick=async()=>{
  if(!NAVER_MAPS.key){resumeRequest=()=>find.click();openPreferences();return}
  if(!['localhost','127.0.0.1'].includes(location.hostname)){
   status.textContent='기존 Python 서버를 실행하고 http://localhost:8765에서 열어 주세요.';return;
  }
  if(!goal.value.trim()){goal.focus();status.textContent='목적지 주소나 좌표를 입력해 주세요.';return}
  const controller=new AbortController();routeController=controller;
  const {signal}=controller;
  find.disabled=true;repeat.hidden=true;next.hidden=true;status.textContent='자동차 경로를 찾고 있어요.';
  const deadline=setTimeout(()=>controller.abort('timeout'),18000);
  try{
   const [from,to]=await Promise.all([start.value.trim()?pointFor(start.value.trim(),signal):position(),pointFor(goal.value.trim(),signal)]);
   lines=await driving(from,to,signal);if(signal.aborted)return;index=0;read();
  }catch(error){
   if(!signal.aborted||signal.reason==='timeout'){status.textContent=signal.reason==='timeout'?'응답이 늦어지고 있어요. 다시 눌러 주세요.':error.message;say(status.textContent)}
  }finally{clearTimeout(deadline);find.disabled=false}
 };
}

document.querySelector('#previous').onclick=()=>{if(history.state?.gyeotaeDepth)history.back();else go('S0',true)};
function openPreferences(){
 ++speechRevision;stopListening();window.speechSynthesis?.cancel();preferences.showModal();
}
document.querySelector('#settings').onclick=openPreferences;
const installSpeech=document.querySelector('#install-speech');
const speechStatus=document.querySelector('#speech-settings-status');
installSpeech.hidden=!speechAPI()?.install;
installSpeech.onclick=async()=>{
 installSpeech.disabled=true;
 try{
  const installed=await speechAPI().install(speechOptions);
  if(installed){voiceEnabled=true;save('gyeotae-voice-enabled',true)}
  speechStatus.textContent=installed?'한국어 음성 인식을 설치했어요.':'이 브라우저에서 한국어 음성 인식을 설치할 수 없어요.';
 }catch{speechStatus.textContent='한국어 음성 인식을 설치할 수 없어요. Chrome의 사이트 권한을 확인해 주세요.'}
 finally{installSpeech.disabled=false}
};
document.querySelector('#close-preferences').onclick=()=>preferences.close();
document.querySelector('#family-settings').onclick=()=>{preferences.close();go('F1')};
preferences.addEventListener('close',()=>{resumeRequest=null;startVoice()});
document.querySelector('#maps-credentials').onsubmit=event=>{
 event.preventDefault();
 const key=document.querySelector('#maps-key');
 if(!key.value.trim()){
  showSpeechIssue('API 키를 입력해 주세요.');return;
 }
 NAVER_MAPS.key=key.value.trim();key.value='';
 const retry=resumeRequest;resumeRequest=null;preferences.close();
 if(retry)retry();else showSpeechIssue('네이버 지도 키를 적용했어요.');
};
addEventListener('popstate',()=>{render(location.hash.slice(1)||'S0');startVoice()});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){++speechRevision;stopListening()}else startVoice()});
addEventListener('resize',fit);fit();render(location.hash.slice(1)||'S0');startVoice();
