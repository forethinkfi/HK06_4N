<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>곁에</title>
<style>
html,body{margin:0;min-height:100%;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#e4e4e4}
body{display:grid;justify-items:center;align-content:start;min-height:100dvh}
main{position:relative;overflow:hidden}
main>div{transform-origin:top left;transform:scale(var(--scale,1))}
button,.touch{touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid #2563eb;outline-offset:-4px}
button[aria-pressed=true]{outline:3px solid #2563eb;outline-offset:-4px}

.topbar{position:relative;width:100%;box-sizing:border-box;display:flex;justify-content:space-between;padding:4px 8px;gap:8px;background:#e4e4e4}
.topbar button,.form button{min-height:44px;border:2px solid #222;border-radius:14px;background:#fff;color:#222;font-family:inherit;font-size:16px;font-weight:700;padding:5px 14px}
.topbar button:disabled{opacity:.5;cursor:default}
.form{padding:24px 21px;display:flex;flex-direction:column;gap:14px;background:#fff;box-sizing:border-box;overflow:auto!important}
.form [hidden]{display:none}.route-entry{position:absolute;z-index:4;right:12px;top:62px;min-height:44px;border:2px solid #222;border-radius:14px;background:white;font:700 16px sans-serif;padding:6px 12px}
#speech-issue:not(:empty){position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:10;background:#222;color:#fff;padding:9px 14px;border-radius:12px;width:max-content;max-width:85vw}
#guidance-retry{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);z-index:11;min-height:48px;border:2px solid #222;border-radius:12px;background:#fff;color:#111;padding:8px 16px;font:inherit;font-size:17px;font-weight:700}
.form h1{font-size:23px;margin:0}.form p{margin:0;line-height:1.45}
.form input:not([type=file]){box-sizing:border-box;width:100%;padding:10px;border:2px solid #222;border-radius:10px;font:inherit}
.form audio{width:100%}.form .strong{background:#222;color:white}.form .spacer{flex:1}
[data-route-status]{min-height:40px;white-space:pre-line}
.route-preview{margin:0;flex-shrink:0}
.route-viewport{position:relative;background:#f1f5f9;border:2px solid #cbd5e1;border-radius:12px;overflow:hidden}
.route-viewport canvas{display:block;width:100%;height:auto}
.route-map-layer{position:absolute;inset:0;visibility:hidden}
.route-map-layer.ready{visibility:visible}
.route-preview figcaption{font-weight:700;margin:0 0 6px;color:#111}
.route-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:15px;color:#222}
.route-legend b::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;background:#1556c0}
.route-legend b:first-child::before{background:#047857}
.route-legend b:last-child::before{background:#b91c1c}

.phone{max-width:100vw;box-sizing:border-box;border:2px solid #222;border-radius:24px;overflow:hidden;background:#e4e4e4}
.phone main>div:first-child{border:0!important;border-radius:0!important}
.phone .topbar{border-bottom:1px solid #bbb}
.phone .topbar{background:#e4e4e4;padding-inline:10px}
.question,.question:active,.question:focus{color:#111!important;background:#fff!important}
.answers button:not(:last-child){height:auto!important;min-height:54px;padding:8px;font-family:inherit;font-size:26px!important;font-weight:700}
dialog:not([open]){display:none} dialog{width:min(350px,calc(100vw - 32px));max-height:85dvh;border:2px solid #222;border-radius:18px;color:#111}
dialog::backdrop{background:#0008}
.form select{min-height:44px;padding:6px;font:inherit;color:#111;background:#fff;border:2px solid #222;border-radius:10px}
dialog label{display:grid;gap:5px;font-weight:700}

.taxi-arrival{position:absolute;inset:0;width:390px;height:844px;box-sizing:border-box;background:#fff;color:#101010;padding:18px 30px 24px;overflow:auto;text-align:center;scrollbar-width:thin}
.taxi-arrival h1{margin:0 0 35px;text-align:left;color:#666;font-size:17px;font-weight:600}
.taxi-arrival .arrival-message{display:grid;align-content:center;min-height:118px;box-sizing:border-box;margin:0;background:#3d479e;color:#fff;border-radius:21px;padding:14px 10px;font-size:22px;font-weight:800;line-height:1.43;white-space:pre-line}
.taxi-reference{background-image:var(--taxi-reference);background-size:389px 814px;background-repeat:no-repeat}
.taxi-avatar{width:145px;height:160px;margin:22px auto 19px;background-position:-124px -219px}
.taxi-vehicle{box-sizing:border-box;min-height:362px;border:2px solid #7887ce;border-radius:22px;padding:34px 10px 21px}
.taxi-vehicle h2{font-size:24px;font-weight:800;margin:0 0 12px}
.taxi-vehicle p,.taxi-example{font-size:15px;line-height:1.45;margin:0}
.taxi-car{width:215px;height:175px;margin:33px auto 0;background-position:-88px -532px}
.taxi-example{margin-top:13px;color:#222}
.taxi-actions{display:grid;gap:9px;margin-top:25px;text-align:center}
.taxi-actions button{border:2px solid #3d479e;border-radius:13px;background:#fff;color:#303b8a;font:inherit;font-weight:700;min-height:46px}
.taxi-actions .taxi-confirm{background:#3d479e;color:#fff}
.taxi-actions summary{padding:10px;cursor:pointer;font-weight:700}
.taxi-actions details[open]{display:grid}
.taxi-actions details button{display:block;width:100%;margin-top:8px}
.taxi-actions .taxi-mic{color:#555;font-size:13px}
</style><style>

.app-flow{width:390px;height:844px;gap:16px;padding:20px;align-items:stretch;background:#f8fafc;color:#171a21}
.flow-header{display:flex;justify-content:space-between;align-items:center;color:#554005;font-weight:700}
.flow-badge{align-self:flex-start;border:2px solid #303d86;border-radius:24px;padding:6px 12px;color:#303d86;background:#fff}
.app-flow .flow-question{font-size:28px;text-align:center;line-height:1.4;background:#fff;color:#171a21;border:2px solid #303d86;border-radius:18px;padding:17px 12px;white-space:pre-line}
.flow-visual{flex:none;text-align:center;font-size:22px;border-radius:18px;overflow:hidden;background:#eef0fa}
.flow-visual:has(.flow-plate){padding:12px}
.flow-visual .taxi-avatar{margin:16px auto}
.flow-visual .taxi-car{margin:8px auto;max-height:160px}
.flow-plate{display:inline-block;border-radius:6px;background:#f4e66e;padding:4px 12px;color:#171a21}
.flow-map{position:relative;background:#dceadf}
.flow-map svg{display:block;width:100%;height:204px}
.flow-map-label{position:absolute;right:8px;bottom:8px;padding:4px 8px;background:white;border-radius:7px;font-size:15px}

<script>

async function listen(callback,fallback){
 const SR=speechAPI();
 if(!SR){showSpeechIssue('이 브라우저는 음성 인식을 지원하지 않아요. Chrome에서 열어 주세요.');fallback('unsupported');return}

 rec.onresult=event=>{

   'service-not-allowed':'이 브라우저의 음성 인식이 제한되어 있어요. Chrome에서 열어 주세요.',
   'audio-capture':'마이크를 찾을 수 없어요.',

  };

async function mapRequest(service,params,signal){

  const image=await response.blob();

  const png=[137,80,78,71,13,10,26,10].every((byte,index)=>signature[index]===byte);

  if(png||jpeg)return image.slice(0,image.size,png?'image/png':'image/jpeg');
  const error=await image.text().then(JSON.parse).catch(()=>null);
  const code=String(error?.error?.errorCode??error?.errorCode??'');
  if(code==='200'||code==='210')throw new Error('네이버 지도 인증을 확인해 주세요. Maps 오류 코드: '+code);
  throw new Error('네이버가 지도 이미지 대신 다른 응답을 보냈어요.'+(/^\d+$/.test(code)?' Maps 오류 코드: '+code:''));
 }
 const data=await response.json().catch(()=>null);
 if(response.status===401||response.status===403)throw new Error('Maps 인증에 실패했어요. Key ID, Key, API 사용 설정을 확인해 주세요.');
 if(response.status===429)throw new Error('Maps 요청 한도에 도달했어요.');

}

function routeViewport(path){
 const world=path.map(([lon,lat])=>{
  const latitude=Math.max(-85.05112878,Math.min(85.05112878,lat))*Math.PI/180;
  return [(lon+180)/360,(1-Math.asinh(Math.tan(latitude))/Math.PI)/2];
 });
 let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
 for(const [x,y] of world){
  minX=Math.min(minX,x);maxX=Math.max(maxX,x);
  minY=Math.min(minY,y);maxY=Math.max(maxY,y);
 }
 const x=(minX+maxX)/2,y=(minY+maxY)/2;
 const width=348,height=416,margin=48;
 // NAVER Static Map uses a 512-pixel world at level zero in logical pixels.
 const zoom=Math.floor(Math.log2(Math.min(
  (width-2*margin)/Math.max(maxX-minX,1e-10),
  (height-2*margin)/Math.max(maxY-minY,1e-10)

 const level=Math.min(18,Math.max(6,zoom));
 const center=[x*360-180,Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI].join(',');

}

  canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
  const ctx=canvas.getContext('2d');
  if(!ctx)throw new Error('지도 경로를 표시할 수 없어요.');
  const sx=canvas.width/view.width,sy=canvas.height/view.height,pixels=512*2**view.level;
  const points=view.world.map(([x,y])=>[
   canvas.width/2+(x-view.x)*pixels*sx,
   canvas.height/2+(y-view.y)*pixels*sy
  ]);
  ctx.drawImage(image,0,0,canvas.width,canvas.height);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...points[0]);
  for(const point of points.slice(1))ctx.lineTo(...point);
  ctx.strokeStyle='#fff';ctx.lineWidth=10*sx;ctx.stroke();
  ctx.strokeStyle='#1556c0';ctx.lineWidth=5*sx;ctx.stroke();
  for(const [point,color] of [[points[0],'#047857'],[points.at(-1),'#b91c1c']]){
   ctx.beginPath();ctx.arc(...point,7*sx,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();
   ctx.strokeStyle='#fff';ctx.lineWidth=2*sx;ctx.stroke();
  }
  canvas.hidden=false;
  return true;
 }finally{URL.revokeObjectURL(source)}
}


async function drawRoute(container,path,signal){
 const clientId=(await configuredMaps()).mapsClientId;
 if(!clientId)throw new Error('서버에 네이버 지도 Client ID가 설정되지 않았어요.');
 const maps=await loadNaverMap(clientId);
 if(signal.aborted||!container.isConnected)return;
 const points=path.map(([lon,lat])=>new maps.LatLng(lat,lon));
 routeMap=new maps.Map(container,{center:points[0],zoom:15,zoomControl:true});
 const currentMap=routeMap;
 const line=new maps.Polyline({map:routeMap,path:points,strokeColor:'#1556c0',strokeWeight:6,strokeOpacity:0.9});
 new maps.Marker({map:routeMap,position:points[0],title:'출발지'});
 new maps.Marker({map:routeMap,position:points.at(-1),title:'목적지'});
 routeMap.fitBounds(line.getBounds(),{top:28,right:28,bottom:28,left:28,maxZoom:18});
 return new Promise(resolve=>{
  const listener=maps.Event.addListener(currentMap,'tilesloaded',()=>finish(!mapAuthFailed));
  const timeout=setTimeout(()=>finish(false),6000);
  function finish(ready){
   clearTimeout(timeout);maps.Event.removeListener(listener);
   if(signal.aborted||currentMap!==routeMap||!container.isConnected){resolve(false);return}
   if(ready)container.classList.add('ready');
   else{currentMap.destroy();routeMap=null}
   resolve(ready);
  }
 });
}

let guidanceContext, guidanceSource;
function unlockGuidanceAudio(){
 const Context=window.AudioContext||window.webkitAudioContext;
 if(!Context)return;

async function playUnlockedGuidance(audio,controller,after,text){
 if(guidanceContext?.state!=='running')return false;
 let buffer;
 try{buffer=await guidanceContext.decodeAudioData(await audio.arrayBuffer())}catch{return false}
 if(guidanceRequest!==controller||controller.signal.aborted)return true;
 const source=guidanceContext.createBufferSource();
 source.buffer=buffer;
 source.connect(guidanceContext.destination);
 source.onended=()=>{
  if(guidanceRequest===controller){stopGuidance();after?.()}
 };
 guidanceSource=source;source.start();narrationStarted(text);
 return true;
}
function stopGuidance(){
 narratingText='';
 if(guidanceSource){
  guidanceSource.onended=null;
  guidanceSource.stop();
  guidanceSource.disconnect();
  guidanceSource=null;
 }
 guidanceRequest?.abort();guidanceRequest=null;
 if(guidanceAudio){guidanceAudio.pause();guidanceAudio=null}
 if(guidanceURL){URL.revokeObjectURL(guidanceURL);guidanceURL=null}
 guidanceRetry.hidden=true;guidanceRetry.onclick=null;
}
async function requestGuidance(text,signal){
 const fixed=fixedGuidance.get(text);
 if(fixed){
  try{
   const response=await fetch(fixed,{signal});
   if(response.ok){const audio=await response.blob();if(audio.size&&audio.type.startsWith('audio/'))return audio}
  }catch(error){if(signal.aborted)throw error}
 }
 const headers={'Content-Type':'application/json'};
 const options={method:'POST',headers,body:JSON.stringify({text}),signal};
 for(let attempt=0;attempt<2;attempt++){
  let response;
  try{response=await fetch('/api/guidance-audio',options)}
  catch(error){if(attempt||signal.aborted)throw error;continue}
  if(response.ok){
   const audio=await response.blob();
   if(audio.type==='audio/wav'&&audio.size)return audio;
   throw new Error('음성 파일을 재생할 수 없어요.');
  }
  if(!attempt&&[422,502,504].includes(response.status))continue;
  const problem=await response.json().catch(()=>null);
  throw new Error(problem?.error||'안내 음성을 가져오지 못했어요.');
 }
}
async function speakGuidance(text,after){
 stopGuidance();stopListening();
 const cache=liveAudioCache;
 const controller=new AbortController();guidanceRequest=controller;
 const {signal}=controller;
 const deadline=setTimeout(()=>controller.abort('timeout'),44000);
 try{
  let audio=cache.get(text);
  if(!audio){
   audio=await requestGuidance(text,signal);
   if(signal.aborted)return;
   if(cache.size>=8)cache.delete(cache.keys().next().value);
   cache.set(text,audio);
  }
  if(signal.aborted)return;
  if(await playUnlockedGuidance(audio,controller,after,text))return;
  if(signal.aborted)return;
  guidanceURL=URL.createObjectURL(audio);
  guidanceAudio=new Audio(guidanceURL);
  guidanceAudio.onplaying=()=>{if(guidanceRequest===controller)narrationStarted(text)};
  guidanceAudio.onended=()=>{if(guidanceRequest===controller){stopGuidance();after?.()}};
  guidanceAudio.onerror=()=>{if(guidanceRequest===controller){stopGuidance();showSpeechIssue('Gemini Live 음성을 재생하지 못했어요.');after?.()}};
  try{await guidanceAudio.play()}
  catch(error){
   if(error.name!=='NotAllowedError')throw error;
   if(guidanceRequest!==controller)return;
   guidanceRetry.hidden=false;
   guidanceRetry.onclick=()=>{
    unlockGuidanceAudio();
    stopListening();
    guidanceRetry.hidden=true;
    if(flow[id]&&speechLine()===text){speakQuestion();return}
    guidanceAudio?.play().catch(()=>{if(guidanceRequest===controller)guidanceRetry.hidden=false});
   };
   if(id==='N-E1')after?.();
  }
 }catch(error){
  if(guidanceRequest!==controller)return;
  const message=signal.reason==='timeout'?'Gemini 음성 응답이 늦어요.':(error.message||'Gemini 음성을 재생할 수 없어요.');
  stopGuidance();showSpeechIssue(message);
  guidanceRetry.hidden=false;
  guidanceRetry.onclick=()=>{unlockGuidanceAudio();speakGuidance(text,after)};
  after?.();
 }finally{clearTimeout(deadline)}
}

function flowMap(){
 const panel=flowElement('div','','flow-map flow-naver-map');
 const image=flowElement('img');
 image.hidden=true;image.alt='네이버 지도';
 const status=flowElement('p','네이버 지도를 불러오는 중이에요.');
 status.setAttribute('role','status');
 const form=flowElement('form','','flow-map-form');
 const address=flowElement('input');
 address.placeholder='도로명 주소 또는 경도,위도';
 address.setAttribute('aria-label','지도에서 볼 주소 또는 좌표');
 const search=flowElement('button','지도 찾기');search.type='submit';
 const directions=flowElement('button','실제 경로 보기');directions.type='button';
 directions.onclick=()=>routeForTrip(id.startsWith('N-W')&&id!=='N-W11'?'walk':'drive');
 const screen=id;
 const walkingScreen=/^N-W[1-4]$/u.test(screen);
 const goalAddress=places.find(([name])=>name===destination)?.[1]||'';
 const initialAddress=(walkingScreen?'':pickupAddress||flowHome().address)||'';
 address.value=initialAddress;
 async function loadNaverMap(){
  routeController?.abort();
  const controller=new AbortController();routeController=controller;
  const {signal}=controller;
  status.textContent='네이버 지도를 불러오는 중이에요.';
  const deadline=setTimeout(()=>controller.abort('timeout'),18000);
  try{
   const value=address.value.trim();
   const center=await (value?pointFor(value,signal):position());
   if(signal.aborted||!panel.isConnected)return;
   const blob=await mapRequest('static-map',{center,level:'15'},signal);
   if(signal.aborted||!panel.isConnected)return;
   const url=URL.createObjectURL(blob);
   const candidate=new Image();candidate.src=url;
   try{await candidate.decode()}
   catch{URL.revokeObjectURL(url);throw new Error('네이버 지도 이미지를 표시할 수 없어요. 다시 찾아 주세요.')}
   if(signal.aborted||!panel.isConnected){URL.revokeObjectURL(url);return}
   if(mapURL)URL.revokeObjectURL(mapURL);
   mapURL=url;image.src=mapURL;image.hidden=false;
   status.textContent=value?'네이버 지도 · 검색한 위치':'네이버 지도 · 현재 위치';
   if(screen==='N-E13'&&goalAddress){
    try{
     const target=await pointFor(goalAddress,signal);
     const route=await driving(center,target,signal);
     if(!validRoute(route.path)||signal.aborted||!panel.isConnected)return;
     if(routeMap){routeMap.destroy();routeMap=null}
     if(await drawStaticRoute(routeCanvas,route.path,signal)){
      image.hidden=true;
      status.textContent='네이버 지도 · 병원까지 자동차 경로';
     }
    }catch{if(!signal.aborted)status.textContent+=' · 경로는 실제 경로 보기에서 다시 확인해 주세요.'}
   }
  }catch(error){
   if(panel.isConnected&&(!signal.aborted||signal.reason==='timeout')){
    status.textContent=signal.reason==='timeout'?'지도가 늦어지고 있어요. 다시 찾아 주세요.':error.message;
   }
  }finally{clearTimeout(deadline)}
 }
 const viewport=flowElement('div','','flow-map-viewport');
 const routeCanvas=flowElement('canvas','','flow-route-canvas');
 routeCanvas.hidden=true;
 routeCanvas.setAttribute('aria-label','주변 도로와 병원까지의 경로를 표시한 네이버 지도');
 viewport.append(image,routeCanvas);
 form.onsubmit=event=>{event.preventDefault();routeCanvas.hidden=true;loadNaverMap()};
 form.append(address,search);
 form.hidden=true;
 const searchToggle=flowElement('button','주소로 찾기','gy-map-toggle');searchToggle.type='button';
 searchToggle.setAttribute('aria-expanded','false');
 searchToggle.onclick=()=>{form.hidden=!form.hidden;searchToggle.setAttribute('aria-expanded',String(!form.hidden));if(!form.hidden)address.focus()};
 status.className='gy-map-status';directions.className='gy-map-toggle';
 const tools=flowElement('div','','gy-map-tools');
 const toolRow=flowElement('div','','gy-map-row');
 toolRow.append(directions,searchToggle);
 tools.append(status,toolRow,form);
 panel.append(viewport);
 panel.tools=tools;
 queueMicrotask(()=>{if(panel.isConnected)loadNaverMap()});
 return panel;
}

async function flowHeard(raw){
 const spoken=raw.trim().slice(0,320);
 if(!spoken)return;
 cancelDialogue();stopGuidance();stopListening();++speechRevision;
 const text=aliases.find(([phrase])=>phrase===spoken)?.[1]||spoken;
 const normalized=text.replace(/[.?!。]+$/u,'').trim();
 if(/^(이전|뒤로|아까 거)( 가| 가 줘)?$/u.test(normalized)){document.querySelector('#previous').click();return}
 if(/^(다시|다시 알려줘|다시 말해줘)$/u.test(normalized)){speakQuestion();return}
 const actions=dialogueActions(currentFlow);
 const exactYes=/^(응|네|예|맞아|맞아요|그래|좋아요|확인했어|확인했어요|그렇게 해 주세요|그대로 해 주세요|그렇게 해줘)$/u;
 const exactNo=/^(아니|아니야|아니요|아뇨|싫어|안 할래|아직|안 보여|그건 아니에요)$/u;
 const exact=exactYes.test(normalized)?actions.find(action=>action.voice==='응')
  :exactNo.test(normalized)?actions.find(action=>action.voice==='아니')
  :actions.find(action=>!['trip','input'].includes(action.voice)&&(normalized===action.voice||normalized===action.label));
 if(exact){exact.run();return}
 if(normalized==='잠깐'||normalized==='잠시만요'||normalized==='잠시만'){
  startVoice();return;
 }
 if(entranceScreens.has(id)&&/^(병원 가게 택시 잡아줘|병원 가게 택시 불러줘|택시 잡아줘|택시 불러줘)$/u.test(normalized)){
  tripMode='taxi';go('N-E2');return;
 }
 if(location.protocol==='file:'){
  dialogueReply('자유 대화는 서버에서 사용할 수 있어요. 지금은 화면의 선택지를 눌러 주세요.');return;
 }
 const controller=new AbortController();
 dialogueRequest=controller;
 const screen=id;
 const deadline=setTimeout(()=>controller.abort('timeout'),10000);
 const hint=micLabel();if(hint)hint.textContent='답을 생각하고 있어요';
 try{
  const headers={'Content-Type':'application/json'};
  if(typeof geminiKey!=='undefined'&&geminiKey)headers['x-gemini-key']=geminiKey;
  const response=await fetch('/api/dialogue',{method:'POST',headers,signal:controller.signal,body:JSON.stringify({
   text:spoken,question:currentFlow.line,previous:dialogueHistory.slice(-3),screen,
   options:actions.map(action=>({label:action.label.slice(0,100),intent:action.voice.slice(0,100)})).slice(0,24)
  })});
  if(!response.ok)throw new Error('Dialogue request failed');
  const result=await response.json();
  if(dialogueRequest!==controller||id!==screen||preferences.open)return;
  const action=actions[result.choice];
  if(result.kind==='choose'&&Number.isInteger(result.choice)&&result.choice>=0&&result.choice<24&&action){
   const value=typeof result.value==='string'?result.value.trim().slice(0,100):'';
   if(action.voice!=='input'||value){action.run({value,mode:result.mode});return}
  }
  const reply=typeof result.reply==='string'?result.reply.trim().slice(0,220):'';
  if(!reply)throw new Error('Empty dialogue reply');
  dialogueHistory.push({user:spoken,assistant:reply});
  if(dialogueHistory.length>3)dialogueHistory.shift();
  dialogueReply(reply);
 }catch{
  if(dialogueRequest===controller&&id===screen){
   dialogueReply('지금은 답변에 연결하기 어려워요. 다시 말씀하시거나 화면의 선택지를 눌러 주세요.');
  }
 }finally{
  clearTimeout(deadline);
  if(dialogueRequest===controller)dialogueRequest=null;
 }
}
function normalizeVoice(text){return text.normalize('NFKC').replace(/[^\p{L}\p{N}]/gu,'')}
function guidanceEcho(text){
 const phrase=normalizeVoice(text), guidance=normalizeVoice(narratingText);
 return Boolean(phrase&&guidance.includes(phrase));
}

 }
 if(index===1){

  consent.onchange=()=>{picture.disabled=recording.disabled=!consent.checked;if(!consent.checked){picture.value='';recording.value=''}};
  button('아바타 미리 보기',()=>{
   if(!consent.checked||!picture.files[0]){status.textContent='동의하고 사진을 선택해 주세요.';return}

 }
 if(index===2||index===7){

   note('선택한 사진과 음성 미리 듣기는 앱을 열어 둔 동안 사용할 수 있어요.');
   button('다시 선택하기',()=>go('N-A2'));next('이걸로 할게요');
  }else{

   note('등록한 주소, 병원과 말 표현은 이 브라우저에 저장돼요.');

 }
 if(index===3){

 }
 if(index===4){

   places=places.filter(([saved])=>saved!==name.value.trim());

   save('gyeotae-places',places);renderFamilyFlow();

 }
 if(index===5){

  next();
 }
 add(status);app.replaceChildren(screen);
}
